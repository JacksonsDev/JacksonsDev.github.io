<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, intitial-scale=1">
        <title>Perry | Software Developer</title>
        <link rel="stylesheet" href="/styles.css">
    </head>
    <body>
        <header>
            <h1>Perry</h1>
            <p>Junior Software Developer | Full-Stack Enthusiast | BSc Computing and IT</p>
            <nav>
                <a href="#projects">Projects</a>
                <a href="#skills">Skills</a>
                <a href="#contact">Contact</a>
            </nav>
        </header>
        <section id="contact">
            <h2>Contact me</h2>
            <form action="https://formspree.io/f/mqalaaey" method="POST">
                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name" required><br><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email" name="_replyto" required><br><br>

                <label for="message">Message:</label>
                <textarea name="message" id="message" rows="5" required></textarea><br><br>

                <button type="submit">Send Message</button>
            </form>
        </section>
        <footer>
            <p>2025 Perry | Hosted with GitHub Pages</p>
        </footer>
    </body>
</html>
