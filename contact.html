<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, intitial-scale=1" />
    <title>Perry | Software Developer</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <h1>Perry Jackson</h1>
      <p>
        Junior Software Developer | Full-Stack Enthusiast | BSc Computing and IT
      </p>
      <nav>
        <a href="/index.html">Home</a>
        <a href="/projects.html">Projects</a>
        <a href="/contact.html">Contact</a>
      </nav>
    </header>
    <section id="contact">
      <h2>Contact me</h2>
      <form
        id="contact-form"
        action="https://formspree.io/f/mqalaaey"
        method="POST"
      >
        <p id="form-status"></p>
        <label for="name">Name:</label><br />
        <input type="text" id="name" name="name" required /><br /><br />

        <label for="email">Email:</label><br />
        <input type="email" id="email" name="_replyto" required /><br /><br />

        <label for="message">Message:</label>
        <textarea name="message" id="message" rows="5" required></textarea
        ><br /><br />
          <div class="button-container">
            <button type="submit">Send Message</button>
          </div>
              </form>
    </section>
    <footer>
      <p>2025 Perry | Hosted with GitHub Pages</p>
    </footer>

    <script>
      const form = document.getElementById("contact-form");
      const status = document.getElementById("form-status");

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        const data = new FormData(form);
        const action = form.action;

        try {
          const response = await fetch(action, {
            method: "POST",
            body: data,
            headers: {
              Accept: "application/json",
            },
          });

          if (response.ok) {
            status.innerHTML = "✅ Message sent! I’ll get back to you shortly.";
            status.style.color = "green";
            form.reset();
          } else {
            status.innerHTML = "❌ There was an issue. Please try again.";
            status.style.color = "red";
          }
        } catch (error) {
          status.innerHTML = "❌ Error sending form. Check your connection.";
          status.style.color = "red";
        }
      });
    </script>
  </body>
</html>
