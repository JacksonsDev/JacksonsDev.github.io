<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevTask | Task Manager for Developers</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="../images/JD_Favicon.png" type="image/png" />
  </head>
  <body>
    <header>

      <div class="header-container">
        <div class="branding">
          <img src="../images/JD_Logo.png" alt="Company Logo" class="logo" />
          <h1>Jackson Digital</h1>
        </div>
        <nav>
          <ul class="nav-links">
            <li><button id="home-btn">Home</button></li>
            <li><button id="login-btn">Login</button></li>
            <li><button id="register-btn">Register</button></li>
            <li><button id="logout-btn" class="hidden">Logout</button></li>
        </nav>
      </div>
    </header>

    <main>
      <section id="welcome-section">
        <h2>Welcome to DevTask</h2>
        <p id="welcome-message">The task tracker for developers. Please register or login to continue.</p>
      </section>

      <section id="register-section" class="auth-form hidden">
        <h2>Create Account</h2>
        <form id="register-form">
          <input type="text" placeholder="Username" name="username" required />
          <input type="email" placeholder="Email" name="email" required />
          <input type="password" placeholder="Password" name="password" required />
          <button type="submit">Register</button>
        </form>
      </section>

      <section id="login-section" class="auth-form hidden">
        <h2>Login</h2>
        <form id="login-form">
          <input type="email" placeholder="Email" name="email" required />
          <input type="password" placeholder="Password" name="password" required />
          <button type="submit">Login</button>
        </form>
      </section>

      <!-- Task Dashboard -->
      <section id="dashboard" class="hidden">
        <h2>Create New Task</h2>
        <form id="task-form">
          <input type="text" placeholder="Task Title" name="title" required />
          <textarea
            name="description"
            placeholder="Task Description"
            required
          ></textarea>
          <button type="submit">Add Task</button>
        </form>
        <br><hr><br>
        <h2>Your Tasks</h2>
        <div id="task-list" class="task-grid"></div>
        <br><hr><br>
        <h2>Completed Tasks</h2>
        <div id="completed-section" class="task-grid">

        </div>
      </section>
    </main>
    <footer>
      <p>2025 Jacksons Dev | Dev Task</p>
    </footer>
    <script type="module" src="script.js"></script>
  </body>
</html>
